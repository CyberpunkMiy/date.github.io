<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐑 我和小羊的 2026 Date 清单</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

    :root {
      --pink: #f8a4b8;
      --pink-light: #fce4ec;
      --pink-dark: #e91e63;
      --warm: #fff5f7;
      --text: #4a3347;
      --text-light: #8a7080;
      --accent: #ff6b9d;
      --green: #a8e6cf;
      --green-dark: #56ab7b;
      --shadow: rgba(232, 130, 160, 0.15);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--warm);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Floating hearts background */
    .bg-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 20px;
      opacity: 0.08;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.08; }
      90% { opacity: 0.08; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-emoji {
      font-size: 64px;
      margin-bottom: 12px;
      display: block;
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--pink-dark);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-light);
      font-weight: 300;
    }

    /* Progress */
    .progress-section {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px var(--shadow);
      animation: fadeIn 0.8s ease 0.2s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .progress-header span {
      font-size: 14px;
      color: var(--text-light);
    }

    .progress-header .count {
      font-weight: 700;
      color: var(--pink-dark);
      font-size: 16px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: var(--pink-light);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--pink), var(--accent));
      border-radius: 6px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Add section */
    .add-section {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
      box-shadow: 0 4px 20px var(--shadow);
      animation: fadeIn 0.8s ease 0.3s both;
    }

    .add-section h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      color: var(--pink-dark);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-form {
      display: flex;
      gap: 12px;
    }

    .add-form input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--pink-light);
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Noto Sans SC', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .add-form input::placeholder {
      color: #cbb0be;
    }

    .add-form input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(248, 164, 184, 0.15);
    }

    .emoji-picker {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .emoji-btn {
      width: 36px;
      height: 36px;
      border: 2px solid var(--pink-light);
      border-radius: 10px;
      background: white;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji-btn:hover {
      border-color: var(--pink);
      transform: scale(1.15);
    }

    .emoji-btn.selected {
      border-color: var(--pink-dark);
      background: var(--pink-light);
      transform: scale(1.1);
    }

    .add-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--pink), var(--accent));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    /* Date list - Grid layout */
    .date-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .date-list h2 {
      grid-column: 1 / -1;
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      color: var(--pink-dark);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.8s ease 0.4s both;
    }

    .date-item {
      background: white;
      border-radius: var(--radius);
      padding: 20px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
      box-shadow: 0 2px 12px var(--shadow);
      transition: all 0.3s;
      animation: popIn 0.4s ease both;
      position: relative;
      overflow: hidden;
    }

    .date-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--pink), var(--accent));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .date-item:hover::before {
      opacity: 1;
    }

    .date-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .date-item.completed {
      opacity: 0.55;
    }

    .date-item.completed .date-text {
      text-decoration: line-through;
      color: var(--text-light);
    }

    .date-item.removing {
      animation: popOut 0.35s ease forwards;
    }

    @keyframes popOut {
      to { opacity: 0; transform: scale(0.8); }
    }

    .check-circle {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--pink-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      flex-shrink: 0;
      font-size: 12px;
    }

    .check-circle:hover {
      border-color: var(--green-dark);
      background: var(--green);
    }

    .date-item.completed .check-circle {
      border-color: var(--green-dark);
      background: var(--green);
    }

    .date-emoji {
      font-size: 36px;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .date-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .date-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      word-break: break-word;
      line-height: 1.4;
    }

    .date-completed {
      font-size: 11px;
      color: var(--green-dark);
      margin-top: 6px;
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 6px;
      transition: background 0.2s;
      display: inline-block;
    }

    .date-completed:hover {
      background: rgba(168, 230, 207, 0.3);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(74, 51, 71, 0.4);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 28px 24px 20px;
      width: 320px;
      max-width: 90vw;
      box-shadow: 0 12px 40px rgba(232, 130, 160, 0.25);
      transform: scale(0.9);
      transition: transform 0.25s;
    }

    .modal-overlay.show .modal-box {
      transform: scale(1);
    }

    .modal-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      color: var(--pink-dark);
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }

    .modal-date-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--pink-light);
      border-radius: 12px;
      font-size: 16px;
      font-family: 'Noto Sans SC', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }

    .modal-date-input:focus {
      border-color: var(--pink);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-btn.cancel {
      background: var(--pink-light);
      color: var(--text-light);
    }

    .modal-btn.cancel:hover {
      background: #f8d0da;
    }

    .modal-btn.confirm {
      background: linear-gradient(135deg, var(--pink), var(--accent));
      color: white;
    }

    .modal-btn.confirm:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.4);
    }

    .delete-btn {
      position: absolute;
      bottom: 8px;
      right: 10px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #ddd;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: #fff0f3;
      color: var(--pink-dark);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
      animation: fadeIn 0.8s ease;
    }

    .empty-state .empty-emoji {
      font-size: 64px;
      margin-bottom: 16px;
      display: block;
    }

    .empty-state p {
      font-size: 15px;
      line-height: 1.8;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 60px;
      padding: 20px;
      color: var(--text-light);
      font-size: 13px;
      animation: fadeIn 0.8s ease 0.6s both;
    }

    .footer .heart {
      color: var(--pink-dark);
      display: inline-block;
      animation: heartbeat 1.5s ease infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }

    /* Responsive */
    @media (max-width: 540px) {
      .header h1 { font-size: 22px; }
      .header-emoji { font-size: 48px; }
      .add-form { flex-direction: column; }
      .add-btn { width: 100%; }
      .container { padding: 24px 16px 60px; }
      .date-list { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .date-item { padding: 16px 10px 14px; }
      .date-emoji { font-size: 30px; }
      .date-text { font-size: 13px; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--pink-light); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--pink); }
  </style>
</head>
<body>

  <!-- Floating hearts background -->
  <div class="bg-hearts" id="bgHearts"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <span class="header-emoji">🐑💕</span>
      <h1>我和小羊的 2026 Date 清单</h1>
      <p>一起完成这些美好的小事吧 ✨</p>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-header">
        <span>完成进度</span>
        <span class="count" id="progressText">0 / 0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
      </div>
    </div>

    <!-- Add new date -->
    <div class="add-section">
      <h2>✏️ 添加新约会</h2>
      <div class="add-form">
        <input type="text" id="dateInput" placeholder="想和小羊一起做什么呢..." maxlength="50">
        <button class="add-btn" id="addBtn">添加</button>
      </div>
      <div class="emoji-picker" id="emojiPicker">
        <button class="emoji-btn selected" data-emoji="💕">💕</button>
        <button class="emoji-btn" data-emoji="🎬">🎬</button>
        <button class="emoji-btn" data-emoji="⛷️">⛷️</button>
        <button class="emoji-btn" data-emoji="🎪">🎪</button>
        <button class="emoji-btn" data-emoji="🎡">🎡</button>
        <button class="emoji-btn" data-emoji="🌸">🌸</button>
        <button class="emoji-btn" data-emoji="🏖️">🏖️</button>
        <button class="emoji-btn" data-emoji="🎵">🎵</button>
        <button class="emoji-btn" data-emoji="🎨">🎨</button>
        <button class="emoji-btn" data-emoji="🍜">🍜</button>
        <button class="emoji-btn" data-emoji="📷">📷</button>
        <button class="emoji-btn" data-emoji="✈️">✈️</button>
        <button class="emoji-btn" data-emoji="🌅">🌅</button>
        <button class="emoji-btn" data-emoji="🎂">🎂</button>
        <button class="emoji-btn" data-emoji="🎮">🎮</button>
        <button class="emoji-btn" data-emoji="🐾">🐾</button>
      </div>
    </div>

    <!-- Date list -->
    <div class="date-list" id="dateList">
      <h2>📋 我们的约会清单</h2>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Made with <span class="heart">♥</span> for 小羊 · 2026</p>
    </div>
  </div>

  <!-- Date Edit Modal -->
  <div class="modal-overlay" id="dateModal">
    <div class="modal-box">
      <div class="modal-title" id="dateModalLabel">修改完成日期</div>
      <input type="date" id="dateModalInput" class="modal-date-input">
      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeDateModal()">取消</button>
        <button class="modal-btn confirm" onclick="saveDateModal()">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ===== Data =====
    const STORAGE_KEY = '2026_date_list';

    const defaultItems = [
      { id: 1, text: '看一场电影', emoji: '🎬', completed: false, completedDate: '' },
      { id: 2, text: '一起滑雪', emoji: '⛷️', completed: false, completedDate: '' },
      { id: 3, text: '看一场脱口秀', emoji: '🎪', completed: false, completedDate: '' },
      { id: 4, text: '坐一次摩天轮', emoji: '🎡', completed: false, completedDate: '' },
      { id: 5, text: '一起看日出', emoji: '🌅', completed: false, completedDate: '' },
      { id: 6, text: '去海边散步', emoji: '🏖️', completed: false, completedDate: '' },
      { id: 7, text: '一起做一顿饭', emoji: '🍜', completed: false, completedDate: '' },
      { id: 8, text: '去游乐园', emoji: '🎠', completed: false, completedDate: '' },
      { id: 9, text: '一起吃一顿漂亮饭', emoji: '🍽️', completed: false, completedDate: '' },
      { id: 10, text: '一起去酒吧喝酒', emoji: '🍸', completed: false, completedDate: '' },
      { id: 11, text: '去新疆旅游', emoji: '🏜️', completed: false, completedDate: '' },
      { id: 12, text: '去西藏旅游', emoji: '🏔️', completed: false, completedDate: '' },
      { id: 13, text: '一起开卡丁车', emoji: '🏎️', completed: false, completedDate: '' },
    ];

    let dateItems = loadData();
    let selectedEmoji = '💕';

    // ===== Storage =====
    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const data = JSON.parse(saved);
          return data.map(item => ({
            ...item,
            completedDate: item.completedDate || ''
          }));
        }
      } catch (e) {}
      return [...defaultItems];
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dateItems));
    }

    // ===== Render =====
    function render() {
      const list = document.getElementById('dateList');
      const total = dateItems.length;
      const done = dateItems.filter(i => i.completed).length;

      // Progress
      document.getElementById('progressText').textContent = `${done} / ${total}`;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';

      // Keep the h2, rebuild item cards
      const h2 = list.querySelector('h2');
      list.innerHTML = '';
      if (h2) list.appendChild(h2);

      if (total === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.style.gridColumn = '1 / -1';
        empty.innerHTML = `
          <span class="empty-emoji">📝</span>
          <p>还没有约会计划哦<br>快去添加第一个吧！</p>`;
        list.appendChild(empty);
        return;
      }

      dateItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `date-item ${item.completed ? 'completed' : ''}`;
        card.dataset.id = item.id;
        card.style.animationDelay = `${index * 0.05}s`;

        let dateHtml = '';
        if (item.completed) {
          dateHtml = `<div class="date-completed" onclick="openDateEditor(${item.id})" title="点击修改完成日期">✅ ${item.completedDate}</div>`;
        }

        card.innerHTML = `
          <div class="check-circle" onclick="toggleItem(${item.id})">
            ${item.completed ? '✓' : ''}
          </div>
          <span class="date-emoji">${item.emoji}</span>
          <div class="date-content">
            <div class="date-text">${escapeHtml(item.text)}</div>
            ${dateHtml}
          </div>
          <button class="delete-btn" onclick="removeItem(${item.id})" title="删除">✕</button>`;
        list.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ===== Actions =====
    function addItem() {
      const input = document.getElementById('dateInput');
      const text = input.value.trim();
      if (!text) {
        showToast('请输入约会内容哦～');
        input.focus();
        return;
      }

      dateItems.unshift({
        id: Date.now(),
        text: text,
        emoji: selectedEmoji,
        completed: false,
        completedDate: ''
      });

      saveData();
      render();
      input.value = '';
      input.focus();
      showToast('添加成功！和小羊约起来吧～ 💕');
    }

    function toggleItem(id) {
      const item = dateItems.find(i => i.id === id);
      if (item) {
        item.completed = !item.completed;
        if (item.completed) {
          const today = new Date();
          item.completedDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        } else {
          item.completedDate = '';
        }
        saveData();
        render();
        if (item.completed) {
          showToast('太棒了！又完成一个约会～ 🎉');
        }
      }
    }

    function removeItem(id) {
      const el = document.querySelector(`.date-item[data-id="${id}"]`);
      if (el) {
        el.classList.add('removing');
        setTimeout(() => {
          dateItems = dateItems.filter(i => i.id !== id);
          saveData();
          render();
          showToast('已删除～');
        }, 400);
      }
    }

    // ===== Edit Completed Date (Modal) =====
    let editingItemId = null;

    function openDateEditor(id) {
      const item = dateItems.find(i => i.id === id);
      if (!item) return;
      editingItemId = id;

      const modal = document.getElementById('dateModal');
      const input = document.getElementById('dateModalInput');
      const label = document.getElementById('dateModalLabel');
      label.textContent = `修改「${item.text}」的完成日期`;
      input.value = item.completedDate || '';
      modal.classList.add('show');
      setTimeout(() => input.showPicker ? input.showPicker() : input.focus(), 100);
    }

    function closeDateModal() {
      document.getElementById('dateModal').classList.remove('show');
      editingItemId = null;
    }

    function saveDateModal() {
      if (editingItemId === null) return;
      const item = dateItems.find(i => i.id === editingItemId);
      const input = document.getElementById('dateModalInput');
      if (item && input.value) {
        item.completedDate = input.value;
        saveData();
        showToast('完成日期已更新～ 📅');
      }
      closeDateModal();
      render();
    }

    // Close modal on backdrop click
    document.getElementById('dateModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeDateModal();
    });

    // ===== Toast =====
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ===== Emoji Picker =====
    document.getElementById('emojiPicker').addEventListener('click', (e) => {
      const btn = e.target.closest('.emoji-btn');
      if (!btn) return;
      document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedEmoji = btn.dataset.emoji;
    });

    // ===== Input =====
    document.getElementById('addBtn').addEventListener('click', addItem);
    document.getElementById('dateInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addItem();
    });

    // ===== Floating Hearts =====
    function createFloatingHearts() {
      const container = document.getElementById('bgHearts');
      const hearts = ['💕', '💗', '💖', '✨', '🌸', '🐑', '♥', '💝'];
      for (let i = 0; i < 15; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (14 + Math.random() * 20) + 'px';
        heart.style.animationDuration = (12 + Math.random() * 18) + 's';
        heart.style.animationDelay = (Math.random() * 15) + 's';
        container.appendChild(heart);
      }
    }

    // ===== Init =====
    createFloatingHearts();
    render();
  </script>
</body>
</html>
